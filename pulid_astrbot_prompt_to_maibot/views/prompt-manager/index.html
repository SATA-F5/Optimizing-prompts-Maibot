<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Maibot Prompt</title>
<style>
  :root {
    --bg: #ffffff;
    --card: #f6f7f9;
    --border: #e2e5ea;
    --text: #1a1d23;
    --muted: #6b7280;
    --accent: #2563eb;
  }
  [data-theme="dark"] {
    --bg: #14161a;
    --card: #1d2026;
    --border: #2c3038;
    --text: #e5e7eb;
    --muted: #9ca3af;
    --accent: #60a5fa;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 14px;
    line-height: 1.6;
  }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .subtitle { color: var(--muted); margin: 0 0 20px; font-size: 13px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .card h2 { font-size: 14px; margin: 0 0 12px; }
  .block-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
  }
  .block-row:last-child { border-bottom: none; }
  .block-name { font-weight: 500; }
  .badge {
    font-size: 12px;
    padding: 2px 10px;
    border-radius: 10px;
    background: var(--border);
    color: var(--muted);
  }
  .badge.on { background: rgba(37,99,235,0.12); color: var(--accent); }
  .meta-row {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
  }
  .meta-row span:first-child { color: var(--muted); }
  pre {
    white-space: pre-wrap;
    word-break: break-word;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px;
    margin: 0;
    max-height: 360px;
    overflow-y: auto;
    font-family: "Cascadia Code", "Consolas", monospace;
    font-size: 12px;
  }
  button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 8px 18px;
    font-size: 13px;
    cursor: pointer;
  }
  button:hover { opacity: 0.9; }
</style>
</head>
<body>
  <h1>麦botの优化提示词</h1>
  <p class="subtitle">查看当前模块状态和拼装后的提示词内容，模块开关请在插件配置页修改。</p>

  <div class="card">
    <h2>模块状态</h2>
    <div id="blocks"></div>
  </div>

  <div class="card">
    <h2>运行信息</h2>
    <div class="meta-row"><span>注入位置</span><span id="mode">-</span></div>
    <div class="meta-row"><span>自定义规则</span><span id="custom">-</span></div>
  </div>

  <div class="card">
    <h2>提示词预览</h2>
    <pre id="preview">加载中...</pre>
    <div style="margin-top:12px">
      <button id="refresh">刷新</button>
    </div>
  </div>

<script type="module">
  const bridge = window.AstrBotPluginView;
  await bridge.ready();

  async function load() {
    const status = await bridge.apiGet("status");
    const blocksEl = document.getElementById("blocks");
    blocksEl.innerHTML = "";
    for (const block of status.blocks) {
      const row = document.createElement("div");
      row.className = "block-row";
      const name = document.createElement("span");
      name.className = "block-name";
      name.textContent = block.label;
      const badge = document.createElement("span");
      badge.className = "badge" + (block.enabled ? " on" : "");
      badge.textContent = block.enabled ? "开启" : "关闭";
      row.appendChild(name);
      row.appendChild(badge);
      blocksEl.appendChild(row);
    }
    document.getElementById("mode").textContent =
      status.injection_mode === "system_prompt" ? "系统提示词追加" : "用户消息追加";
    document.getElementById("custom").textContent =
      status.has_custom ? "已配置" : "未配置";

    const preview = await bridge.apiGet("preview");
    document.getElementById("preview").textContent =
      preview.content || "所有模块均已关闭。";
  }

  document.getElementById("refresh").addEventListener("click", load);
  await load();
</script>
</body>
</html>
